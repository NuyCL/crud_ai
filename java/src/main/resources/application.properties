spring.main.banner-mode=off
spring.jmx.enabled=false
server.shutdown=graceful

# Undertow keeps the request path as sent. Tomcat and Jetty decode it first and reject what does not decode
# (%FF, %00, %2F) with their own HTML 400 before any code of ours runs; the spec wants those to be "not found"
# or part of the key (BR-55). See docs/porting/java-analysis.md for the experiment.
server.undertow.decode-url=false

# Everything else that Spring MVC would do (routing, error pages, static files, form bodies, OPTIONS and TRACE) is
# bypassed: handler/Api is a servlet filter that answers every request itself.
