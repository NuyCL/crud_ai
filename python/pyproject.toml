[project]
name = "ffservice-py"
version = "0.1.0"
description = "Feature flag service (Python port of the Go reference)"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F/W: pycodestyle and pyflakes; I: import order; B: bugbear; UP: modern syntax; SIM: simplifications;
# RUF: ruff's own checks; PLR2004 is left off because the spec's constants are named where it matters.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
# The tests contain look-alike Unicode digits on purpose (they are the inputs that must be rejected).
"tests/*" = ["RUF001"]
