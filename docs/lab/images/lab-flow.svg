<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Noto Sans Thai, Sarabun, Tahoma, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2433"/></marker></defs>
  <rect width="900" height="250" fill="#f7f9fc"/>
  <text x="450" y="26" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2433">เส้นทางของแลบ: อ่านก่อน → รัน → ทำพัง → แปล → ตรวจ → รีวิว</text>
  <g font-size="13" font-weight="700" fill="#1b2433" text-anchor="middle">
    <rect x="10" y="60" width="90" height="70" rx="8" fill="#e2e8f0" stroke="#334155"/><text x="55" y="90">00</text><text x="55" y="110">เตรียมเครื่อง</text>
    <rect x="115" y="60" width="90" height="70" rx="8" fill="#bfdbfe" stroke="#1d4ed8"/><text x="160" y="90">01</text><text x="160" y="110">spec+vectors</text>
    <rect x="220" y="60" width="90" height="70" rx="8" fill="#bbf7d0" stroke="#15803d"/><text x="265" y="90">02</text><text x="265" y="110">Go + contract</text>
    <rect x="325" y="60" width="90" height="70" rx="8" fill="#fecaca" stroke="#b91c1c"/><text x="370" y="90">03</text><text x="370" y="110">ทำพังจงใจ</text>
    <rect x="430" y="60" width="90" height="70" rx="8" fill="#fde68a" stroke="#b45309"/><text x="475" y="90">04</text><text x="475" y="110">port layer</text>
    <rect x="535" y="60" width="90" height="70" rx="8" fill="#fde68a" stroke="#b45309"/><text x="580" y="90">05</text><text x="580" y="110">ทดลอง fw</text>
    <rect x="640" y="60" width="90" height="70" rx="8" fill="#fbcfe8" stroke="#be185d"/><text x="685" y="90">06</text><text x="685" y="110">differential</text>
    <rect x="745" y="60" width="70" height="70" rx="8" fill="#e9d5ff" stroke="#7e22ce"/><text x="780" y="90">07</text><text x="780" y="110">SDK+CORS</text>
    <rect x="825" y="60" width="70" height="70" rx="8" fill="#e2e8f0" stroke="#334155"/><text x="860" y="90">08</text><text x="860" y="110">รีวิว</text>
  </g>
  <g stroke="#1b2433" stroke-width="2" marker-end="url(#a)"><line x1="100" y1="95" x2="113" y2="95"/><line x1="205" y1="95" x2="218" y2="95"/><line x1="310" y1="95" x2="323" y2="95"/><line x1="415" y1="95" x2="428" y2="95"/><line x1="520" y1="95" x2="533" y2="95"/><line x1="625" y1="95" x2="638" y2="95"/><line x1="730" y1="95" x2="743" y2="95"/><line x1="815" y1="95" x2="823" y2="95"/></g>
  <g font-size="13" fill="#1b2433">
    <text x="450" y="170" text-anchor="middle">ทุก module ใช้รีโปเดียวกัน • รันในเครื่อง ไม่ใช้ cloud • ค่าใช้จ่าย: 0 บาท</text>
    <text x="450" y="195" text-anchor="middle">ส่วนที่ใช้ AI (module 04, 05, 08) อ่านและทำตามขั้นตอนได้ แม้ไม่มี Claude Code</text>
    <text x="450" y="220" text-anchor="middle">ที่เหลือ (01-03, 06, 07) ใช้แค่ terminal และ browser</text>
  </g>
